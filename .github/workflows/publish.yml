name: Publish daily post

# Triggered by cron-job.org at 19:30 IST weekdays / 11:00 IST weekends via:
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/publish.yml/dispatches
#   Authorization: Bearer <fine-grained PAT, actions:write, this repo only>
#   Accept: application/vnd.github+json
#   Body: {"ref":"main"}          -> expect 204
#
# NOTE: workflow_dispatch only becomes triggerable once this file is on the
# DEFAULT branch. Dispatching before then returns a misleading 404.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Override date (YYYY-MM-DD). Blank = today in IST."
        required: false
        type: string
      dry_run:
        description: "Resolve the post and image URL without publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TZ_OFFSET_MIN: "330"
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish.js

      - name: Record the result
        if: success() && inputs.dry_run != true
        run: |
          git config user.name  "kindtruth-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/queue.json content/published.json
          git diff --staged --quiet || git commit -m "publish: $(date -u +%F)"
          git push
